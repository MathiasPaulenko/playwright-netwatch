name: publish
on:
  release:
    types: [published]
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm CLI >= 11.5.1; Node 22 ships npm 10.x.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      # Idempotent: skip when the version is already on npm (e.g. the
      # manual first publish, or re-running a failed release job).
      - name: Check published version
        id: published
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          V="${TAG#v}"
          if npm view "playwright-netwatch@$V" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish --provenance --access public
        if: steps.published.outputs.exists == 'false'
