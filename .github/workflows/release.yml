name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
  # GITHUB_TOKEN-created releases don't emit release:published, so the
  # publish job calls the reusable publish workflow directly.
  publish:
    needs: create
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
